<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="../assets/css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - ONG Exemplo</title>
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header>
    <h1>ONG Exemplo</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <!-- Conteúdo Principal com Formulário -->
  <main>
    <h2>Formulário de Cadastro</h2>

    <form action="#" method="post">
      
      <!-- Bloco 1: Dados Pessoais -->
      <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="nome">Nome Completo:</label>
        <input 
          type="text" 
          id="nome" 
          name="nome" 
          maxlength="50" 
          required
        ><br><br>

        <label for="cpf">CPF:</label>
        <input 
          type="text" 
          id="cpf" 
          name="cpf" 
          pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
          placeholder="000.000.000-00" 
          title="Digite o CPF no formato 000.000.000-00" 
          required
        ><br><br>

        <label for="email">E-mail:</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required
        ><br><br>

        <label for="telefone">Telefone:</label>
        <input 
          type="tel" 
          id="telefone" 
          name="telefone" 
          pattern="\(\d{2}\)\s?\d{4,5}-\d{4}" 
          placeholder="(85) 99999-9999" 
          title="Digite o telefone no formato (XX) 9XXXX-XXXX" 
          required
        ><br><br>

        <label for="nascimento">Data de Nascimento:</label>
        <input 
          type="date" 
          id="nascimento" 
          name="nascimento" 
          required
        ><br><br>

        <label for="senha">Senha:</label>
        <input 
          type="password" 
          id="senha" 
          name="senha" 
          minlength="8" 
          required
        ><br><br>
      </fieldset>

      <!-- Bloco 2: Localização -->
      <fieldset>
        <legend>Localização e Endereço</legend>

        <label for="cep">CEP:</label>
        <input 
          type="text" 
          id="cep" 
          name="cep" 
          pattern="\d{5}-\d{3}" 
          placeholder="60000-000" 
          title="Digite o CEP no formato 00000-000" 
          required
        ><br><br>

        <label for="endereco">Endereço:</label>
        <input 
          type="text" 
          id="endereco" 
          name="endereco" 
          required
        ><br><br>

        <label for="cidade">Cidade:</label>
        <input 
          type="text" 
          id="cidade" 
          name="cidade" 
          required
        ><br><br>

        <label for="estado">Estado (UF):</label>
        <select id="estado" name="estado" required>
          <option value="">Selecione...</option>
          <option value="CE">Ceará</option>
          <option value="SP">São Paulo</option>
          <option value="RJ">Rio de Janeiro</option>
        </select><br><br>
      </fieldset>

      <!-- Bloco 3: Preferências de Engajamento -->
      <fieldset>
        <legend>Opções de Engajamento</legend>

        <p>Áreas de Interesse:</p>
        <input type="checkbox" id="pedagógico" name="interesse" value="pedagogico">
        <label for="pedagógico">Apoio Pedagógico</label><br>
        
        <input type="checkbox" id="logistica" name="interesse" value="logistica">
        <label for="logistica">Logística e Eventos</label><br>

        <input type="checkbox" id="comunicacao" name="interesse" value="comunicacao">
        <label for="comunicacao">Comunicação e Mídias</label><br><br>

        <p>Disponibilidade:</p>
        <input type="radio" id="manhas" name="disponibilidade" value="manha" required>
        <label for="manhas">Manhãs</label><br>

        <input type="radio" id="tardes" name="disponibilidade" value="tarde">
        <label for="tardes">Tardes</label><br>

        <input type="radio" id="finais" name="disponibilidade" value="final_semana">
        <label for="finais">Finais de Semana</label><br><br>
      </fieldset>

      <br>
      <button type="submit">Enviar Cadastro</button>
      <button type="reset">Limpar Formulário</button>
    </form>
  </main>

  <!-- Rodapé Institucional -->
  <footer>
    <p>&copy; 2026 ONG Exemplo. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
