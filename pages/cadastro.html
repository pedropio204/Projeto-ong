<section class="form-section">
  <h2>Cadastro de Voluntários</h2>
  <form class="app-form" novalidate>
    <div class="form-group">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" name="nome" required minlength="3">
    </div>
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required aria-describedby="email-desc">
      <small id="email-desc" class="sr-only">Digite um e-mail válido para contato.</small>
    </div>
    <div class="form-group">
      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone" required>
    </div>
    <div class="form-group">
      <label for="area">Área de Atuação</label>
      <select id="area" name="area" required>
        <option value="">Selecione...</option>
        <option value="Educacao">Educação</option>
        <option value="Sustentabilidade">Sustentabilidade</option>
        <option value="Saude">Saúde</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Cadastrar</button>
  </form>
</section>
